<!DOCTYPE html>
<html>
<head>
    <title>Tizen TV App</title>
    <script src="js/script_2.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        #myElement {
            color: black;
            font-size: 20px;
        }
    </style>
</head>
<body>

<div id="mainView">
    <div id="searchView" class="selectableRow">
        <label for="searchField">search</label><input type="text" id="searchField" placeholder="Search Movies..."
                                                      class="selectableCol">
        <button id="searchButton" class="selectableCol">Search</button>
        <p id="keyView"></p>
    </div>
    <div id="categoriesContainer"></div>
</div>


    <div id="searchResultView">
        <div id="categoriesContainer"></div>
    </div>

<div id="seriesView" style="display: none;">
    <img id="image" alt="Movie Poster">
    <h2 id="title"></h2>
    <p id="description"></p>
    <div id="sublistContainer"></div>
</div>
<div id="seasonView" style="display: none;">
    <img id="image" alt="Movie Poster">
    <h2 id="title"></h2>
    <p id="description"></p>
    <div id="sublistContainer"></div>
</div>

<div id="episodeView" style="display: none;">
    <img id="image" alt="Movie Poster">
    <h2 id="title"></h2>
    <p id="description"></p>
    <div id="sublistContainer"></div>
</div>

<div id="filmView" style="display: none;">
    <img id="image" alt="Movie Poster">
    <h2 id="title"></h2>
    <p id="description"></p>
    <div id="sublistContainer"></div>
</div>

<div id="videoView" style="display: none; position: relative;">
    <!-- <h2 id="episodeTitle"></h2>
    <p id="episodeDescription"></p>
    <div id="resolutionsContainer"></div> -->
    <!-- <video id="videoPlayer" controls autoplay>
        <source src="https://airmax.boats:443/airmaxtv1122/airmaxtv2211/306.ts">
      </video> -->
</div>

<div id="browseView" style="display: none; position: relative;">
</div>

</body>
</html>
